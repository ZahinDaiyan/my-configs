# Fix colors inside tmux so everything looks rich and vibrant
set -g default-terminal "xterm-256color"
set-ga terminal-overrides ",xterm-256color:Tc"

# Lock the status bar firmly to the bottom
set -g status-position bottom

# Background and Foreground styles (Sleek dark theme)
set -g status-justify left
set -g status-style 'fg=colour4 bg=colour234'

# Left Side Panel: Shows your active Session Name with an agnoster arrow
set -g status-left '#[fg=colour232,bg=colour4,bold]  #S #[fg=colour4,bg=colour234,nobold]'
set -g status-left-length 20

# Right Side Panel: Shows Time, Date, and Hostname framed by sharp arrows
set -g status-right '#[fg=colour238,bg=colour234,nobold]#[fg=colour255,bg=colour238] %Y-%m-%d  %H:%M #[fg=colour4,bg=colour238,nobold]#[fg=colour232,bg=colour4,bold] #H '
set -g status-right-length 50

# Current active window tab styling
setw -g window-status-current-format '#[fg=colour234,bg=colour12,nobold]#[fg=colour232,bg=colour12,bold] #I:#W #[fg=colour12,bg=colour234,nobold]'

# Inactive window tab styling
setw -g window-status-format '#[fg=colour244,bg=colour234] #I:#W '
# Fix colors inside tmux for older and newer versions alike
set -g default-terminal "xterm-256color"
set -as terminal-features ",xterm-256color:RGB"
